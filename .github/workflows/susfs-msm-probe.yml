name: susfs-msm-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 准备工作区
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work
      - name: 探测 msm-kernel 复用同一补丁
        run: |
          set -euo pipefail
          python3 susfs-msm-probe.py || echo "::warning::补丁未能零拒绝应用，详见产物"
      - name: 保留探测证据
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: susfs-msm-probe
          path: /mnt/work/msm-probe-report/
          if-no-files-found: error
          retention-days: 14
