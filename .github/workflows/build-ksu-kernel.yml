name: build-ksu-kernel

# 在免费 runner 上构建 OnePlus 13T 内核（官方 35 依赖 + SukiSU 内置）
#
# 关键取舍：
#  - 跳过 vendor 模块编译（RECOMPILE_EXT_MODULE=0），只出 kernel + boot.img。
#    本地参照：全量 3h12m，其中 359 个 vendor ko 占约 2 小时，且对 boot.img 无贡献。
#  - 使用官方默认 defconfig 流程（与本地 3h12m 构建一致），只精准 append 必要项，
#    不替换整份 device-config，避免引入未知差异。
#  - 编译前先单独生成 .config 做门禁校验，避免白跑。
#  - runner 在海外，35 个依赖直接从 GitHub / CodeLinaro 原站下载，不用任何加速前缀。
#  - GitHub 的 /archive/<sha>.tar.gz 非确定性打包，故以"能完整解压"而非字节数作完整性判据。
#
# 本版核心修复：
#  CONFIG_MODULE_SIG_PROTECT=n
#    根因：vendor 模块（rfkill.ko 等）用 OPPO 私钥签名，自编译内核无对应 trusted key，
#    签名校验失败（mod->sig_ok=false）。kernel/module/main.c 中
#    "if (!mod->sig_ok && gki_is_module_protected_export(...))" 会拒绝其导出，
#    导致 rfkill -> cfg80211 -> mac80211 -> qca_cld3 整链加载失败，WiFi/蓝牙不可用。
#    关掉该保护后 gki_is_module_protected_export() 恒返回 false，整链放行。

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'SukiSU 分支或 tag'
        required: false
        default: 'main'
      enable_susfs:
        description: '是否集成 SUSFS（false 先验证核心功能）'
        required: false
        default: 'false'
      susfs_branch:
        description: 'susfs4oki 分支'
        required: false
        default: 'oki-android15-6.6'
      skip_build:
        description: '只做装配与配置验证（不编译）'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TREE_ROOT: /mnt/work/official-13t
      ARCH_DIR: /mnt/work/archives
      SOURCE_DATE_EPOCH: '1789450538'
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work
          df -h /mnt
          echo "cpu=$(nproc) mem=$(free -g | awk '/^Mem/{print $2}')G"

      - name: 安装宿主工具
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git python3 bison flex libelf-dev libssl-dev bc cpio rsync unzip zip \
            dwarves lz4 device-tree-compiler patch
          python3 --version

      - name: 下载并装配官方依赖
        run: |
          python3 ci-assemble.py
          du -sh "$TREE_ROOT" || true

      - name: 安装 SukiSU（必须装到 msm-kernel，那是实际编译树）
        run: |
          set -e
          K="$TREE_ROOT/kernel_platform"
          cd "$K"
          git clone --depth=1 --branch '${{ inputs.ksu_ref }}' \
            https://github.com/ShirkNeko/SukiSU-Ultra KernelSU
          cd KernelSU && git log -1 --format='%H %ci %s' && cd "$K"
          # 关键：msm-kernel 是完整内核树（1.5G，自带 drivers/Kconfig 与 scripts/kconfig），
          # sun_perf 编译走的是它，不是 common。装错位置会导致 Kconfig 不认识 CONFIG_KSU，
          # merge_config.sh 报 "Defconfig fragment did not apply as expected / -KSU y"。
          for T in msm-kernel; do
            rm -rf "$K/$T/drivers/kernelsu"
            cp -a "$K/KernelSU/kernel" "$K/$T/drivers/kernelsu"
            echo "$T kernelsu 文件数: $(find "$K/$T/drivers/kernelsu" -type f | wc -l)"
            grep -q kernelsu "$K/$T/drivers/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$K/$T/drivers/Makefile"
            grep -q 'drivers/kernelsu/Kconfig' "$K/$T/drivers/Kconfig" || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$K/$T/drivers/Kconfig"
            echo "--- $T/drivers/Makefile 尾部 ---"; tail -2 "$K/$T/drivers/Makefile"
            echo "--- $T/drivers/Kconfig 尾部 ---"; tail -3 "$K/$T/drivers/Kconfig"
          done
          echo "--- SukiSU 的 Kconfig 是否定义 config KSU ---"
          grep -n -E '^(config|menuconfig) KSU' "$K/msm-kernel/drivers/kernelsu/Kconfig" | head -3

      - name: 应用 SUSFS 补丁（可选）
        if: ${{ inputs.enable_susfs == 'true' }}
        run: |
          set -e
          K="$TREE_ROOT/kernel_platform"
          U="https://raw.githubusercontent.com/cctv18/susfs4oki/${{ inputs.susfs_branch }}/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          curl -LSs --retry 3 -o /mnt/work/susfs.patch "$U"
          echo "补丁大小: $(wc -c < /mnt/work/susfs.patch) 字节"
          cd "$K/common"
          patch -p1 --forward --batch < /mnt/work/susfs.patch 2>&1 | tee /mnt/work/susfs-apply.log | tail -30
          REJECTS=$(find . -name '*.rej' | wc -l)
          echo "rej 文件数: $REJECTS"
          if [ "$REJECTS" -gt 0 ]; then
            echo "::warning::SUSFS 补丁有 $REJECTS 个冲突，列出如下："
            find . -name '*.rej' | head -20
            echo "::error::SUSFS 补丁不完整，停止"
            exit 1
          fi

      - name: 注入内核配置
        run: |
          set -e
          K="$TREE_ROOT/kernel_platform"
          cat > /mnt/work/inject.fragment <<'EOF'
          CONFIG_KSU=y
          # CONFIG_MODULE_SIG_PROTECT is not set
          EOF
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            cat >> /mnt/work/inject.fragment <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          fi
          # 只注入 msm-kernel 的 defconfig（实际编译树的 DEFCONFIG=gki_defconfig）
          for f in "$K/msm-kernel/arch/arm64/configs/gki_defconfig"; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key="$(echo "$line" | sed 's/^# \([A-Za-z0-9_]*\) is not set/\1/; s/=.*//')"
              sed -i "/^${key}=/d; /^# ${key} is not set/d" "$f"
              echo "$line" >> "$f"
            done < /mnt/work/inject.fragment
            echo "已注入: $f"
            tail -3 "$f"
          done

      - name: 配置门禁
        run: |
          set -e
          K="$TREE_ROOT/kernel_platform"
          cd "$K"
          export PATH="$K/prebuilts/build-tools/path/linux-x86:$PATH"
          ./tools/bazel build //msm-kernel:sun_perf_config 2>&1 | tail -20
          # bazel-bin 是指向 output_base 的符号链接，find 默认不跟随，必须加 -L
          CFG="$K/bazel-bin/msm-kernel/sun_perf_config/out_dir/.config"
          if [ ! -f "$CFG" ]; then
            CFG=$(find -L "$K/bazel-bin" -name '.config' 2>/dev/null | head -1)
          fi
          echo "配置文件: $CFG"
          [ -n "$CFG" ] && [ -f "$CFG" ] || { echo "::error::没找到生成的 .config"; find -L "$K/bazel-bin" -maxdepth 5 -type d 2>/dev/null | head -20; exit 1; }
          cp "$CFG" /mnt/work/config-check.txt
          echo "=== 关键配置校验 ==="
          grep -E '^CONFIG_KSU' "$CFG" || { echo "::error::CONFIG_KSU 未生效"; exit 1; }
          grep -q '^CONFIG_KSU=y' "$CFG" || { echo "::error::CONFIG_KSU 未开启"; exit 1; }
          if grep -q '^CONFIG_MODULE_SIG_PROTECT=y' "$CFG"; then
            echo "::error::MODULE_SIG_PROTECT 仍为 y，WiFi 会失效"; exit 1
          fi
          echo "OK: MODULE_SIG_PROTECT 已关闭"
          grep -E '^CONFIG_MODULE_SIG=|^CONFIG_MODULE_SIG_FORCE|^CONFIG_RFKILL=' "$CFG" || true

      - name: 编译内核（跳过 vendor 模块）
        if: ${{ inputs.skip_build == 'false' }}
        run: |
          set -e
          T="$TREE_ROOT"
          cd "$T"
          export PATH="$T/kernel_platform/prebuilts/build-tools/path/linux-x86:$PATH"
          export RECOMPILE_EXT_MODULE=0
          mkdir -p out/target/product/sun
          bash kernel_platform/oplus/build/oplus_build_kernel.sh sun perf 2>&1 | tee /mnt/work/build.log | tail -60
          D="$T/kernel_platform/out/msm-kernel-sun-perf/dist"
          ls -l "$D/boot.img" "$D/Image" || { echo "::error::没有产出 boot.img"; exit 1; }

      - name: 校验产物
        if: ${{ inputs.skip_build == 'false' }}
        run: |
          D="$TREE_ROOT/kernel_platform/out/msm-kernel-sun-perf/dist"
          cd "$D"
          sha256sum boot.img Image > SHA256SUMS.txt
          cat SHA256SUMS.txt
          strings Image | grep -m2 'Linux version 6.6'
          echo "--- KSU 符号数 ---"
          grep -c -i ksu System.map || true
          cp SHA256SUMS.txt /mnt/work/ 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            /mnt/work/official-13t/kernel_platform/out/msm-kernel-sun-perf/dist/boot.img
            /mnt/work/official-13t/kernel_platform/out/msm-kernel-sun-perf/dist/Image
            /mnt/work/official-13t/kernel_platform/out/msm-kernel-sun-perf/dist/System.map
            /mnt/work/official-13t/kernel_platform/out/msm-kernel-sun-perf/dist/SHA256SUMS.txt
            /mnt/work/config-check.txt
            /mnt/work/build.log
            /mnt/work/susfs-apply.log
          if-no-files-found: warn
          retention-days: 7
